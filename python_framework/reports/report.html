<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test Report</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; padding: 24px; background: #f5f5f5; color: #333; }
  h1   { font-size: 22px; margin: 0 0 4px; }
  .ts  { font-size: 13px; color: #888; margin-bottom: 20px; }
  .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat  { background: #fff; border-radius: 8px; padding: 14px 20px;
            border: 1px solid #e0e0e0; min-width: 100px; }
  .stat .n { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
  .stat .l { font-size: 12px; color: #888; text-transform: uppercase; }
  .bar-bg { background: #e9ecef; border-radius: 8px; height: 10px;
             margin-bottom: 24px; overflow: hidden; }
  .bar-fg { background: #28a745; height: 10px; width: 0%;
             border-radius: 8px; transition: width 0.5s; }
  table  { width: 100%; border-collapse: collapse; background: #fff;
            border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th     { background: #343a40; color: #fff; padding: 10px 12px;
            text-align: left; font-size: 13px; font-weight: 600; }
  tr:hover { filter: brightness(0.97); }
</style>
</head>
<body>
<h1>Test Results</h1>
<div class="ts">Generated: 2026-04-06 13:53:41</div>

<div class="stats">
  <div class="stat"><div class="n" style="color:#333">0</div><div class="l">Total</div></div>
  <div class="stat"><div class="n" style="color:#28a745">0</div><div class="l">Passed</div></div>
  <div class="stat"><div class="n" style="color:#dc3545">0</div><div class="l">Failed</div></div>
  <div class="stat"><div class="n" style="color:#dc3545">0</div><div class="l">Errors</div></div>
  <div class="stat"><div class="n" style="color:#ffc107">0</div><div class="l">Skipped</div></div>
  <div class="stat"><div class="n" style="color:#555">0.0s</div><div class="l">Duration</div></div>
</div>

<div class="bar-bg"><div class="bar-fg"></div></div>

<table>
  <thead>
    <tr>
      <th>Test case</th>
      <th style="text-align:center;width:100px">Status</th>
      <th style="text-align:right;width:80px">Time</th>
      <th>Message</th>
    </tr>
  </thead>
  <tbody>
    
  </tbody>
</table>
</body>
</html>
