name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Python framework: generate tests, build C++, run, publish results
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  generate-and-test:
    name: "Generate Tests & Run (Python + C++)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      # ── Step 1: Checkout ──────────────────────────────────────────────────
      - name: Checkout C++ repo
        uses: actions/checkout@v4

      # ── Step 2: Setup Python ──────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python_framework/requirements.txt

      # ── Step 3: Install Python dependencies ───────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_framework/requirements.txt

      # ── Step 4: Run Python framework tests (meta-tests) ───────────────────
      - name: Test the Python framework itself
        run: |
          cd python_framework
          python -m pytest test_framework.py -v --tb=short

      # ── Step 5: Generate C++ unit tests from header ───────────────────────
      - name: Generate unit tests from C++ header
        run: |
          python python_framework/test_generator.py \
            --header include/calculator.h \
            --output tests/generated/test_generated_calculator.cpp
          echo "---- Preview of generated file (first 40 lines) ----"
          head -40 tests/generated/test_generated_calculator.cpp

      # ── Step 6: Install C++ build tools ───────────────────────────────────
      - name: Install C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ gcovr lcov

      # ── Step 7: Configure CMake ────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_GENERATED_TESTS=ON \
            -G Ninja

      # ── Step 8: Build C++ project ─────────────────────────────────────────
      - name: Build C++ project
        run: cmake --build build --parallel

      # ── Step 9: Run all tests ─────────────────────────────────────────────
      - name: Run generated tests
        run: |
          mkdir -p build/test-results
          cd build
          ctest --output-on-failure \
            --output-junit test-results/junit-results.xml

      # ── Step 10: Publish results with Python reporter ─────────────────────
      - name: Publish results (Python reporter)
        if: always()
        run: |
          python python_framework/report_publisher.py \
            --xml  build/test-results/junit-results.xml \
            --html python_framework/reports/report.html \
            --json python_framework/reports/summary.json

      # ── Step 11: Upload HTML report as artifact ───────────────────────────
      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: python_framework/reports/

      # ── Step 12: Upload JUnit XML ─────────────────────────────────────────
      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: build/test-results/

      # ── Step 13: Show test results in GitHub PR UI ────────────────────────
      - name: Publish test report to GitHub
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "GTest Results"
          path: "build/test-results/*.xml"
          reporter: java-junit
          fail-on-error: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Code Coverage
# ─────────────────────────────────────────────────────────────────────────────
  coverage:
    name: "Code Coverage"
    runs-on: ubuntu-latest
    needs: generate-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ gcovr lcov
          pip install -r python_framework/requirements.txt

      - name: Generate tests
        run: |
          python python_framework/test_generator.py \
            --header include/calculator.h \
            --output tests/generated/test_generated_calculator.cpp

      - name: Configure with coverage flags
        run: cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DBUILD_GENERATED_TESTS=ON -DBUILD_COVERAGE=ON -G Ninja

      - name: Build
        run: cmake --build build-cov --parallel

      - name: Run tests
        run: cd build-cov && ctest --output-on-failure || true

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          gcovr --root . --filter src/ --filter include/ --html-details coverage-report/index.html --xml coverage-report/coverage.xml --txt build-cov/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Multi-platform build
# ─────────────────────────────────────────────────────────────────────────────
  multi-platform:
    name: "Build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: generate-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r python_framework/requirements.txt

      - name: Generate tests
        shell: bash
        run: python python_framework/test_generator.py --header include/calculator.h --output tests/generated/test_generated_calculator.cpp

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install deps (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake ninja

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_GENERATED_TESTS=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: cd build && ctest -C Release --output-on-failure

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Docker Build & Push
# ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: "Docker Build & Push"
    runs-on: ubuntu-latest
    needs: generate-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python and generate tests
        run: |
          pip install -r python_framework/requirements.txt
          python python_framework/test_generator.py \
            --header include/calculator.h \
            --output tests/generated/test_generated_calculator.cpp

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — Release (only on v* tags)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: "Create Release"
    runs-on: ubuntu-latest
    needs: [generate-and-test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate tests and build release binary
        run: |
          pip install -r python_framework/requirements.txt
          python python_framework/test_generator.py \
            --header include/calculator.h \
            --output tests/generated/test_generated_calculator.cpp
          sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc g++
          cmake -B build-rel -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -G Ninja
          cmake --build build-rel --parallel
          mkdir -p release-assets
          tar -czf release-assets/calculator-linux-x86_64.tar.gz -C build-rel/bin calculator_app
          sha256sum release-assets/calculator-linux-x86_64.tar.gz > release-assets/SHA256SUMS.txt

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report-html
          path: release-assets/test-report

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            ## Release ${{ github.ref_name }}

            ### What's included
            - Compiled binary for Linux x86_64
            - HTML test report
            - SHA256 checksums

            ### Docker image
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
          files: |
            release-assets/calculator-linux-x86_64.tar.gz
            release-assets/SHA256SUMS.txt
